services:
  db-mysql:
    image: mysql:8.0
    container_name: db-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      MYSQL_DATABASE: garcia_loyola_christian_enrique
    ports:
      - "3308:3308"
    secrets:
      - mysql_root_password
    volumes:
      - ./scripts:/docker-entrypoint-initdb.d

secrets:
  mysql_root_password:
    file: ./secrets/mysql_root_password.txt
